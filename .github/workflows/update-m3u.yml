name: Auto Update M3U Playlist

on:
  schedule:
    # 每天 UTC 时间 2:00 (即北京时间上午 10:00) 自动执行
    - cron: '0 2 * * *'
  workflow_dispatch: # 允许在 GitHub 网页上手动点击触发

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 赋予推送代码的权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run M3U update script
        id: run_script
        run: python update_m3u.py

      - name: Commit and push changes
        if: steps.run_script.outputs.updated == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add playlist.m3u
          git commit -m "chore: auto update m3u playlist"
          git push
